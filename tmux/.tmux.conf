set -g prefix C-d
bind-key C-d send-prefix

set-window-option -g xterm-keys on

bind r source-file ~/.tmux.conf \; display " Reloaded "

set-option -g status-justify left

# Login shell, without reattach-to-user-namespace. tmux-sensible sets that
# wrapper when the binary exists; if it disappears, new panes die at once
# and the client prints [exited].
set -g default-command "/bin/zsh -l"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'

run-shell '~/.tmux/plugins/tpm/tpm'
run-shell '~/.local/bin/better-tmux --file ~/.config/better-tmux/index.tsx'
